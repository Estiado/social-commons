[build]
command = "npm run build"
publish = "dist/client"
functions = "netlify/functions"

[build.environment]
NODE_VERSION = "22"

[functions]
node_bundler = "esbuild"

# Static assets long-term cache
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.html"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
from = "/api/extract-article"
to = "/.netlify/functions/extract-article"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
